{{- /*
Global OpenTelemetry plugin: every request through Kong becomes the root span of its trace.
Kong does not continue trace context sent by outside clients (nothing is extracted), so clients
cannot choose trace ids or influence sampling. Incoming tracestate and baggage headers are removed
before the request goes upstream, and a fresh W3C traceparent is injected.
*/}}
apiVersion: configuration.konghq.com/v1
kind: KongClusterPlugin
metadata:
  name: global-opentelemetry
  labels:
    global: "true"
    app.kubernetes.io/part-of: txplatform
  annotations:
    kubernetes.io/ingress.class: kong
plugin: opentelemetry
config:
  traces_endpoint: {{ .Values.opentelemetry.tracesEndpoint | quote }}
  resource_attributes:
    service.name: {{ .Values.opentelemetry.serviceName | quote }}
    service.version: {{ .Values.opentelemetry.kongVersion | quote }}
    service.namespace: txplatform
    deployment.environment.name: {{ .Values.environment | quote }}
    # Plugin configuration is static, so pod and node names cannot be added here.
    k8s.namespace.name: {{ .Release.Namespace | quote }}
    k8s.deployment.name: {{ .Values.opentelemetry.deploymentName | quote }}
  propagation:
    extract: []
    clear:
      - tracestate
      - baggage
    inject:
      - w3c
    default_format: w3c
