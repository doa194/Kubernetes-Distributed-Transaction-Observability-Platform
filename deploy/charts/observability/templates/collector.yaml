{{- /*
Jaeger Collector: receives OTLP spans from Kong (HTTP) and the .NET services (gRPC), cleans them,
derives span metrics for Prometheus and stores the traces kept by tail sampling in OpenSearch.
It runs independently of Jaeger Query, so either can fail or restart alone.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: jaeger-collector-config
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: jaeger-collector
    app.kubernetes.io/part-of: txplatform
data:
  config.yaml: |
    {{- include "observability.collectorConfig" . | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger-collector
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: jaeger-collector
    app.kubernetes.io/part-of: txplatform
    app.kubernetes.io/component: tracing
spec:
  replicas: 1
  # Keeps a single Collector at all times: the tail-sampling stage keeps per-trace state in memory,
  # so two Collectors must never share traces during a rollout.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: jaeger-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jaeger-collector
        app.kubernetes.io/part-of: txplatform
        app.kubernetes.io/component: tracing
        txplatform.io/network-identity: jaeger-collector
      annotations:
        checksum/config: {{ include "observability.collectorConfig" . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: collector
          image: {{ .Values.image }}
          args:
            - --config=/etc/jaeger/config.yaml
            # Span metrics without resource attributes (pod names, instance ids): see the span_metrics connector.
            - --feature-gates=connector.spanmetrics.excludeResourceMetrics
          ports:
            - { name: otlp-grpc, containerPort: 4317 }
            - { name: otlp-http, containerPort: 4318 }
            - { name: health, containerPort: 13133 }
            - { name: metrics, containerPort: 8888 }
            - { name: span-metrics, containerPort: 8889 }
          resources:
            {{- toYaml .Values.collector.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet: { path: /status, port: health }
            periodSeconds: 3
            failureThreshold: 40
          readinessProbe:
            httpGet: { path: /status, port: health }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /status, port: health }
            periodSeconds: 15
            failureThreshold: 4
          volumeMounts:
            - name: config
              mountPath: /etc/jaeger
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: jaeger-collector-config
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger-collector
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: jaeger-collector
    app.kubernetes.io/part-of: txplatform
spec:
  selector:
    app.kubernetes.io/name: jaeger-collector
  ports:
    - { name: otlp-grpc, port: 4317, targetPort: otlp-grpc }
    - { name: otlp-http, port: 4318, targetPort: otlp-http }
    - { name: metrics, port: 8888, targetPort: metrics }
    - { name: span-metrics, port: 8889, targetPort: span-metrics }
