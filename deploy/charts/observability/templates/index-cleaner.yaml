{{- /*
Nightly trace retention: deletes daily Jaeger indices older than retentionDays.
Daily indices plus a cleaner are simpler than index lifecycle policies for a local setup.
*/}}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: jaeger-index-cleaner
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: jaeger-index-cleaner
    app.kubernetes.io/part-of: txplatform
spec:
  schedule: "55 23 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: jaeger-index-cleaner
            app.kubernetes.io/part-of: txplatform
            txplatform.io/network-identity: jaeger-index-cleaner
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: index-cleaner
              image: {{ .Values.indexCleanerImage }}
              args: [{{ .Values.retentionDays | quote }}, {{ .Values.openSearchUrl | quote }}]
              env:
                - name: INDEX_PREFIX
                  value: {{ .Values.indexPrefix | quote }}
              resources:
                requests: { cpu: 10m, memory: 32Mi }
                limits: { cpu: 200m, memory: 128Mi }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
