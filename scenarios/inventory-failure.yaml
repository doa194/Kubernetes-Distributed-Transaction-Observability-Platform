# InventoryService fails with a server error: the order stops before payment.
schemaVersion: 1
id: inventory-failure
title: Inventory failure
description: >
  InventoryService answers every reservation with HTTP 500, which OrderService does not retry.
  The fraud check still runs in parallel. Orders fail with 502 before payment and shipping, and the
  possibly created reservation is released.
category: application-fault
faults:
  - service: inventory-service
    operation: inventory.reserve
    mode: http-error
    statusCode: 500
    ttlSeconds: 180
workload:
  - profile: concurrent
    requests: 3
    concurrency: 3
expect:
  application:
    statuses: { 502: { all: true } }
    states: { InventoryFailed: { all: true } }
    compensation: [ReleaseInventory]
    authorizationsPerOrder: 0
  telemetry:
    contract: inventory-failure
